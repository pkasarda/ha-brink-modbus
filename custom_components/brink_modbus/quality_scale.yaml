# Home Assistant Integration Quality Scale self-assessment.
# https://developers.home-assistant.io/docs/core/integration-quality-scale/
rules:
  # Bronze
  action-setup:
    status: todo
    comment: Actions are registered when the first config entry is set up, not in async_setup.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage:
    status: todo
    comment: Schema, validation and unique-ID tests exist; full flow-manager coverage does not.
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup:
    status: exempt
    comment: Entities only read coordinator data and subscribe to no events.
  entity-unique-id: done
  has-entity-name: done
  runtime-data:
    status: todo
    comment: The coordinator is stored in hass.data.
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates:
    status: todo
    comment: All bus access is serialised by the coordinator lock; PARALLEL_UPDATES is not declared.
  reauthentication-flow:
    status: exempt
    comment: Modbus has no authentication.
  test-coverage: todo

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: Modbus RTU/TCP devices cannot be discovered.
  discovery-update-info:
    status: exempt
    comment: No discovery.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One config entry is one ventilation unit.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues: todo
  stale-devices:
    status: exempt
    comment: One config entry is one ventilation unit.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: No HTTP.
  strict-typing: todo
